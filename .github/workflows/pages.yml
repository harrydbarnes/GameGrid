name: Deploy GameGrid to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalogue, modes, quality-scored puzzles and performance-budget gate
        working-directory: .
        run: |
          cd scripts
          python build_catalog_v3.py
          mv puzzle*.js index*.js search*.js details*.js ../
          mv catalog-manifest.js ../catalog-manifest.js
          mv catalog-report.json ../catalog-report.json
      - name: Add free IGDB cover artwork
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: python scripts/enrich_covers.py
      - name: Validate catalogue, asset budgets and every puzzle intersection
        run: python scripts/validate_catalog.py
      - name: Set up Node for browser regressions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser regression dependencies
        run: npm ci
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Run browser regression suite against generated assets
        env:
          GAMEGRID_BROWSER_USE_GENERATED: '1'
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
