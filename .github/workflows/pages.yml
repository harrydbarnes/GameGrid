name: Deploy GameGrid to Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'site.webmanifest'
      - 'favicon.svg'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish GameGrid catalogue]
    types: [completed]

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout application shell
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Locate latest successful catalogue bundle
        id: catalogue
        uses: actions/github-script@v7
        with:
          script: |
            let runId;
            if (context.eventName === 'workflow_run') {
              runId = context.payload.workflow_run.id;
            } else {
              const response = await github.rest.actions.listWorkflowRunsForWorkflow({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'catalogue.yml',
                branch: 'main',
                per_page: 20,
              });
              const run = response.data.workflow_runs.find(item => item.status === 'completed' && item.conclusion === 'success');
              runId = run?.id;
            }
            if (!runId) core.setFailed('No successful GameGrid catalogue bundle is available. Run Publish GameGrid catalogue first.');
            else core.setOutput('run-id', String(runId));
      - name: Download fingerprinted catalogue bundle
        uses: actions/download-artifact@v4
        with:
          name: gamegrid-catalogue
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.catalogue.outputs.run-id }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reused catalogue bundle
        run: python scripts/validate_catalog.py
      - name: Set up Node for browser regressions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser regression dependencies
        run: npm ci
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Save Playwright Chromium cache
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run browser regression suite against generated assets
        env:
          GAMEGRID_BROWSER_USE_GENERATED: '1'
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
