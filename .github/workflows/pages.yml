name: Deploy GameGrid to Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - 'tests/browser-regression.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'site.webmanifest'
      - 'favicon.svg'
  workflow_dispatch:
  workflow_run:
    workflows: [Publish GameGrid catalogue]
    types: [completed]

permissions:
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  catalogue_change_gate:
    runs-on: ubuntu-latest
    outputs:
      catalogue_changed: ${{ steps.changed.outputs.catalogue_changed }}
    steps:
      - name: Checkout push history
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect catalogue changes
        id: changed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "catalogue_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -Eq '^(scripts/(build_catalog\.py|build_catalog_v2\.py|build_catalog_v3\.py|catalog_quality\.py|enrich_covers\.py|validate_catalog\.py|test_catalog_.*\.py|test_details_fingerprinting\.py|test_mode_scopes\.py|test_puzzle_rules\.py|test_trial_mode\.py)|\.github/workflows/catalogue\.yml)$'; then
            echo "catalogue_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "catalogue_changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    needs: catalogue_change_gate
    if: ${{ always() && needs.catalogue_change_gate.result == 'success' && ((github.event_name != 'workflow_run' && needs.catalogue_change_gate.outputs.catalogue_changed != 'true') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout application shell
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Locate latest successful catalogue bundle
        id: catalogue
        uses: actions/github-script@v7
        with:
          script: |
            let runId;
            if (context.eventName === 'workflow_run') {
              runId = context.payload.workflow_run.id;
            } else {
              const response = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'catalogue.yml',
                branch: 'main',
                per_page: 20,
              });
              const run = response.data.workflow_runs.find(item => item.status === 'completed' && item.conclusion === 'success');
              runId = run?.id;
            }
            if (!runId) core.setFailed('No successful GameGrid catalogue bundle is available. Run Publish GameGrid catalogue first.');
            else core.setOutput('run-id', String(runId));
      - name: Download fingerprinted catalogue bundle
        uses: actions/download-artifact@v4
        with:
          name: gamegrid-catalogue
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.catalogue.outputs.run-id }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reused catalogue bundle
        run: python scripts/validate_catalog.py
      - name: Stamp shell release and marker
        run: |
          export GAMEGRID_SHELL_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest_text = Path('catalog-manifest.js').read_text(encoding='utf-8')
          match = re.search(r'window\.GAMEGRID_CATALOG_MANIFEST\s*=\s*({.*?})\s*;', manifest_text, re.S)
          if not match:
              raise SystemExit('catalog-manifest.js does not contain a readable manifest')
          manifest = json.loads(match.group(1))
          shell_sha = os.environ['GAMEGRID_SHELL_SHA']
          version = '-'.join(filter(None, (
              shell_sha,
              manifest.get('catalogHash'),
              manifest.get('buildHash'),
              manifest.get('detailsHash'),
          )))
          index = Path('index.html')
          marker = '__GAMEGRID_RELEASE_VERSION__'
          source = index.read_text(encoding='utf-8')
          if marker not in source:
              raise SystemExit('index.html is missing the release marker placeholder')
          index.write_text(source.replace(marker, version, 1), encoding='utf-8')
          Path('release-version.json').write_text(json.dumps({
              'version': version,
              'catalogHash': manifest.get('catalogHash'),
              'buildHash': manifest.get('buildHash'),
              'detailsHash': manifest.get('detailsHash'),
          }, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
      - name: Set up Node for browser regressions
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser regression dependencies
        run: npm ci
      - name: Restore Playwright Chromium cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Chromium for browser regressions
        run: npx playwright install --with-deps chromium
      - name: Save Playwright Chromium cache
        if: ${{ steps.playwright-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Run browser regression suite against generated assets
        env:
          GAMEGRID_BROWSER_USE_GENERATED: '1'
        run: npm run test:browser
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
