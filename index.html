<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11131a"><meta name="description" content="GameGrid: find nine video games that match intersecting clues in today's daily grid."><title>GameGrid</title><link rel="stylesheet" href="./styles.css"></head><body><header class="topbar"><a class="brand" href="./" aria-label="GameGrid home"><span class="brand-mark">GG</span><span>GameGrid</span></a><nav aria-label="Primary navigation"><button class="nav-btn active" data-view="today">Today</button><button class="nav-btn" data-view="archive">Archive</button><button class="nav-btn" data-view="stats">Stats</button><button class="icon-btn" id="helpBtn" aria-label="How to play">?</button><button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button></nav></header><main id="app" class="app-shell"><section id="gameView"><div class="mode-tabs" id="modeTabs" aria-label="Game mode"></div><div class="game-heading"><div><p class="eyebrow" id="modeLabel">DAILY CLASSIC</p><h1 id="puzzleTitle">GameGrid</h1><p class="date" id="puzzleDate"></p></div><div class="guess-card"><span>Guesses left</span><strong id="guessesLeft">9</strong></div></div><div class="game-layout"><div class="grid-wrap"><div id="grid" class="game-grid" aria-label="GameGrid puzzle"></div></div><aside class="side-panel"><div class="panel-card"><span class="panel-kicker">TODAY'S CHALLENGE</span><h2 id="challengeTitle">Match both clues</h2><p id="challengeCopy">Pick a square, then find a game that satisfies its row and column.</p></div><div class="panel-card compact"><div><span class="muted">Solved</span><strong id="solvedCount">0 / 9</strong></div><div><span class="muted">Time</span><strong id="timer">0:00</strong></div></div><button class="secondary-btn" id="giveUpBtn">Give up</button></aside></div></section><section id="archiveView" class="hidden content-view"><p class="eyebrow">ARCHIVE</p><h1>Past grids</h1><div id="archiveList" class="archive-list"></div></section><section id="statsView" class="hidden content-view"><p class="eyebrow">YOUR STATS</p><h1>GameGrid record</h1><div id="statsCards" class="stats-grid"></div></section></main><dialog id="searchDialog" class="search-dialog"><form method="dialog" class="dialog-head"><div><span class="eyebrow">YOUR ANSWER</span><h2 id="searchClue">Choose a game</h2></div><button class="icon-btn" value="cancel" aria-label="Close">×</button></form><div class="search-box"><span>⌕</span><input id="gameSearch" type="search" autocomplete="off" placeholder="Search games…" aria-label="Search games"></div><div id="searchResults" class="search-results"></div></dialog><dialog id="infoDialog" class="info-dialog"><form method="dialog" class="dialog-head"><h2 id="infoTitle">How to play</h2><button class="icon-btn" value="cancel" aria-label="Close">×</button></form><div id="infoBody"></div></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="./data.js"></script><script src="./app.js"></script></body></html>
